// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// The Android modules target Java 21 bytecode (Capacitor 7's supported level),
// but the build itself is intentionally JDK 25-only. Select JDK 25 as the Java
// toolchain while preserving each module's source/target compatibility settings.
subprojects { subproject ->
    subproject.afterEvaluate {
        if (subproject.plugins.hasPlugin('com.android.application') ||
                subproject.plugins.hasPlugin('com.android.library')) {
            subproject.java.toolchain.languageVersion.set(JavaLanguageVersion.of(25))
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
